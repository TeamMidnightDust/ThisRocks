mod:
  name: This Rocks!
  version: 1.9.4
  group: eu.midnightdust
  id: rocks

# Project IDs for Modrinth & CurseForge
publish:
  modrinth: "Sb5ypgDP"
  curseforge: "416283"

# Supported versions and their ranges
"1.21.11":
  mod.mc_releases:
    - "1.21.11"
  mod.fabric_mc_range: "1.21.11"
  mod.neoforge_mc_range: "[1.21.11]"
"26.1":
  mod.mc_releases:
    - "26.1"
    - "26.1.1"
    - "26.1.2"
  mod.fabric_mc_range: ">=26.1.2 <26.2"
  mod.neoforge_mc_range: "[26.1, 26.2)"
"26.2":
  mod.mc_releases:
    - "26.2"
  mod.fabric_mc_range: ">=26.2"
  mod.neoforge_mc_range: "[26.2)"

# Dependencies
deps:
  midnightlib: 1.9.3 # https://www.midnightdust.eu/wiki/midnightlib/#gradleproperties

loomx.loom_version: "1.17-SNAPSHOT"

# Loader-specific dependencies
fabric:deps: # https://fabricmc.net/develop/
  fabric_loader: 0.19.3
  "1.21.11":
    fabric_api: 0.141.6+1.21.11
    polymer: 0.15.2+1.21.11 # https://github.com/Patbox/polymer/releases
    factorytools: 0.9.5+1.21.11 # https://github.com/Patbox/FactoryTools/releases
  "26.1":
    fabric_api: 0.145.1+26.1
    polymer: 0.16.5+26.1.2 # https://github.com/Patbox/polymer/releases
    factorytools: 0.10.1+26.1 # https://github.com/Patbox/FactoryTools/releases
  "26.2":
    fabric_api: 0.157.0+26.2
    polymer: 0.17.3+26.2 # https://github.com/Patbox/polymer/releases
    factorytools: 0.11.2+26.2 # https://github.com/Patbox/FactoryTools/releases
